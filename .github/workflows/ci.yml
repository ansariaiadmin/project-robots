name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install ruff pytest pytest-asyncio
          pip install -e .
      - name: Lint (ruff 0 errors)
        run: ruff check . --exclude .venv
      - name: Tests (181 passed)
        run: python -m pytest -q
      - name: Compile check
        run: python -m py_compile project_robots.py
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker build check
        run: |
          docker build -f Dockerfile -t project-robots:test . || echo "No Dockerfile, skip"
