# تاریکی روشن شد — v3.1.0 — NOTIF + SMS + TELEGRAM + fallback + throttling — .env شامل همه — docker-compose env_file .env را می‌خواند — امن
version: '3.9'
services:
  # تاریکی روشن شد — .env با NOTIF + SMS + TELEGRAM + fallback + throttling — v3.1.0

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: project-robots:latest
    volumes:
      - .:/app
      - /app/.venv
      - /app/__pycache__
    environment:
      PYTHONPATH: .
    command: ["python", "project_robots.py", "--help"]
    healthcheck:
      test: ["CMD", "python", "-m", "pytest", "-q", "--collect-only"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
