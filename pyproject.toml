[project]
name = "project-robots"
version = "0.1.0"
description = "Standard-library-only project automation with compact evidence."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "ruff>=0.5",
]

[tool.project-robots]
default-context-token-budget = 4000
project-mutation = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [".venv", ".cache", "__pycache__", "profiles"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = []
fixable = ["F", "I", "W", "UP", "B", "C4", "SIM"]
unfixable = ["E", "T20"]

[tool.ruff.lint.per-file-ignores]
# Design decisions with reason — E501 long lines:
# - observability.py: metric dict comprehensions more readable as one-liners
# - semantic_patch.py: template strings with placeholders exceed length for readability
# - autonomous/loop.py: prompt building and tool payloads are more readable as single expressions
# - contract_diff.py: complex signature string building is clearer as one line
# - critic.py: critique messages and suggestions are descriptive sentences, breaking reduces clarity
# - model_checker.py: TLA+ spec templates are long by nature
# - selector.py: tool selection descriptions are detailed for prompt context
"robots/evidence/observability.py" = ["E501"]
"robots/tooling/semantic_patch.py" = ["E501"]
"robots/autonomous/loop.py" = ["E501"]
"robots/impact/contract_diff.py" = ["E501"]
"robots/reflexion/critic.py" = ["E501"]
"robots/tooling/model_checker.py" = ["E501"]
"robots/tooling/selector.py" = ["E501"]
