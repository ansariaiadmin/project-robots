[project]
name = "project-robots"
version = "0.1.0"
description = "Standard-library-only project automation with compact evidence."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "ruff>=0.5",
]

[tool.project-robots]
default-context-token-budget = 4000
project-mutation = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = []
fixable = ["F", "I", "W", "UP", "B", "C4", "SIM"]
unfixable = ["E", "T20"]
exclude = [".venv", ".cache", "__pycache__", "profiles"]